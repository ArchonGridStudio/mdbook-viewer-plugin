# UI strings for the mdBook Viewer tool window.
view.embeddedUnavailable=Embedded preview is unavailable here (JCEF is not supported in this IDE or Remote Development backend). Use "Open in browser", or run the plugin in a local IDE.
button.connect.tooltip=Load the URL, or clone and serve a git repository
button.reload.tooltip=Reload the current page
button.openExternal.tooltip=Open the current URL in the system browser
button.token.tooltip=Set an access token for private repositories
token.title=mdBook Viewer
token.prompt=Personal access token for private repositories (leave blank to clear):
task.serving=Serving mdBook from repository
status.cloning=Fetching repository...
status.preparing=Preparing bundled mdBook...
status.starting=Starting mdbook serve...
notification.urlEmpty=Enter an mdBook URL or a git repository URL
notification.embeddedUnavailable=No embedded browser is available to reload here. Use "Open in browser".
notification.notMdBook=This URL does not look like an mdBook - showing it as a regular web page.
notification.platformUnsupported=mdBook Viewer does not ship a renderer for this operating system/architecture ({0}). Supported: Windows x64, macOS (Intel/Apple Silicon), Linux x64.
notification.mdbookVerifyFailed=The bundled mdBook renderer could not start on this machine. This may be an OS security or permission block on the extracted binary.
notification.cloneFailed=Fetch failed: {0}
notification.cloneAuthFailed=Authentication failed. For a private repository, add or update a valid access token with the gear button, then try again.
notification.bookTomlNotFound=No book.toml found in the fetched repository.
notification.serveFailed=mdBook could not serve this book (exit code {0}):\n{1}\n\nIf the book uses a preprocessor or output backend (e.g. [preprocessor.mermaid], [output.katex]), that extension is not bundled and the book cannot be rendered as-is.
notification.serveError=Failed to serve the repository.
