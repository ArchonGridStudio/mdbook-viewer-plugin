group = com.github.nbugash.mdbookviewerplugin
version = 1.1.0

pluginRepositoryUrl = https://github.com/ArchonGridStudio/mdbook-viewer-plugin

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# --- Self-contained bundled renderer (specs/001-self-contained-plugin) ---
# Pinned mdBook release. The build downloads this version's official binaries, verifies each
# SHA-256 below, and bundles them (gzip-compressed) into the plugin. Bumping the version means
# updating all four checksums (run: ./gradlew printMdbookChecksums).
# Source: https://github.com/rust-lang/mdBook/releases
mdbookVersion = 0.5.4
mdbookSha256LinuxX64 = 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
mdbookSha256MacosX64 = a47d7bf0d5d670cff9ee6cce95537cbeb62dc10704d9e7131ffbd13e2b59a5de
mdbookSha256MacosArm64 = 03e8a6d8b13a2971e0b3280affd03b388373c1485e26f73407c3a76b0b1838df
mdbookSha256WindowsX64 = 8a6b2421aa522de06d746871d2b8fff9c8d71773467e310a4516d2566e7f2de4

# --- Bundled mdBook preprocessors (self-contained binaries, put on the serve process PATH) ---
# Each tool is downloaded from its GitHub release, SHA-256 verified, and bundled gzip-compressed for
# all four supported platforms, exactly like the mdBook renderer above. `Tag` is the git tag in the
# download URL; `AssetInfix` is the asset filename up to the platform suffix (the two differ per
# project's release-naming convention). Bumping a version means updating its tag, infix, and four
# checksums (run: ./gradlew printPreprocessorChecksums).
mdbookMermaidTag = v0.17.0
mdbookMermaidAssetInfix = mdbook-mermaid-v0.17.0-
mdbookMermaidSha256LinuxX64 = 8aced70d781830fb0e81988f081c4abdd49e056a001ae2f1e4d484e1f6385c57
mdbookMermaidSha256MacosX64 = 88c6bee0226a8947837344c96ae7f86b4ad3447f91049b2c877772a2732ac752
mdbookMermaidSha256MacosArm64 = 6e4a6bb7423a03d68c2f5869bfe7d3eab339304452129779a9d9abe4c510034f
mdbookMermaidSha256WindowsX64 = 6ff34f3c008ca6905d49ec9eedd1a25b2d0d17e2affe95e959196756daf96886

